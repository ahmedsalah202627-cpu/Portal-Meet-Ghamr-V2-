<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><title>بوابة طلبات المشروع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--card:#fff;--tx:#17202e;--mu:#6b7686;--bd:#e1e6ee;--ac:#1d4f91;--ac2:#2f7bd6;--act:#fff;--sh:0 4px 18px rgba(20,40,80,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141b;--card:#18202b;--tx:#e8edf5;--mu:#93a0b4;--bd:#2a3545;--ac:#4f8fdc;--ac2:#78aef0;--act:#07101d;--sh:0 4px 18px rgba(0,0,0,.35)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Cairo,Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#12315c,#1d4f91 60%,#2f7bd6);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sh)}
.logos{display:flex;gap:8px}.logos img{height:38px;background:#fff;border-radius:9px;padding:3px 7px}header b{flex:1;font-size:17px}header .note{color:#d5e3f7}
main{max-width:1040px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card>b:first-child{display:block;font-size:17px;margin-bottom:6px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(47,123,214,.18)}
input[readonly]{opacity:.75}
button{width:auto;cursor:pointer;background:linear-gradient(120deg,var(--ac),var(--ac2));color:var(--act);border:0;font-weight:600;padding:9px 18px}button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:400}button.x{padding:4px 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px}
.sec{margin:22px 0 4px;padding-right:10px;border-right:4px solid var(--ac2);font-size:15px;color:var(--ac)}
.two{display:flex;align-items:center;gap:8px}.two span{color:var(--mu)}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{font-size:12.5px;color:var(--mu);font-weight:600;background:var(--bg)}tbody tr:hover{background:rgba(47,123,214,.05)}
.tbf td input,.tbf td select{min-width:110px;padding:6px 8px}.tbf{margin-bottom:6px}.tbf button{margin-top:8px}
tbody{counter-reset:r}tbody tr{counter-increment:r}.sn::before{content:counter(r);color:var(--mu)}
table.in{margin:0}table.in th,table.in td{white-space:normal;font-size:13px}
.aks{border:1px solid var(--bd);border-radius:12px;overflow:hidden}.ak{display:grid;grid-template-columns:minmax(150px,1.2fr) 1fr 1.4fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd);align-items:center}.ak:last-child{border:0}
.ak input.no,.ak input.rm{padding:5px 8px}.ck{display:flex!important;gap:8px;align-items:center;margin:0!important;color:var(--tx)!important;font-weight:400!important}.ck input{width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;color:#fff;font-size:12.5px;font-weight:600}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85}
.gr{background:#2e9e5b}.or{background:#e08a1e}.rd{background:#d63a3a}.bk{background:#111}.bl{background:#5b6b82}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--c,#1d4f91);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--sh);color:var(--mu);font-size:13px}.k b{font-size:28px;display:block;color:var(--c,var(--tx));line-height:1.2}
.note{color:var(--mu);font-size:13px}
.lg{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#12315c,#1d4f91 55%,#2f7bd6)}
.lc{width:100%;max-width:400px;padding:26px}.lc .logos{justify-content:center;margin-bottom:14px}.lc .logos img{height:50px;border:1px solid var(--bd)}.lc .btn{width:100%;margin-top:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:5px 14px;font-weight:600;font-size:13px}.chip.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:var(--act);border:0}.cnt{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:0 10px;font-size:13px;margin-right:6px;color:var(--mu)}
</style></head><body><div id="app"></div>

if(me.role=="consultant")rs.sort((a,b)=>(isDone(a)?1:0)-(isDone(b)?1:0)||left(a)-left(b));else rs.sort((a,b)=>b.created-a.created);
let h="";if(me.role=="owner"){const a=rs.length,c=k=>rs.filter(r=>!isC(r)&&r.resp.code==k).length,on=rs.filter(r=>rts(r)<=r.created+14*DAY).length,av=a?(rs.reduce((s,r)=>s+used(r),0)/a).toFixed(1):0;
h+=`<div class="card"><b>لوحة المالك</b><div class="note">يظهر هنا فقط ما رد عليه الاستشاري</div></div><div class="kp"><div class="k"><b>${a}</b>إجمالي</div><div class="k" style="--c:#2e9e5b"><b>${c("A")}</b>موافق</div><div class="k" style="--c:#e08a1e"><b>${c("B")}</b>موافق بملاحظات</div><div class="k" style="--c:#d63a3a"><b>${c("C")}</b>مرفوض</div><div class="k" style="--c:#2e9e5b"><b>${on}</b>في الميعاد</div><div class="k" style="--c:#5b6b82"><b>${rs.filter(isC).length}</b>تقارير مغلقة (NCR/MM/FIR)</div><div class="k" style="--c:#d63a3a"><b>${a-on}</b>متأخر</div><div class="k" style="--c:#2f7bd6"><b>${av}</b>متوسط أيام الرد</div></div>`}
if(me.role=="contractor"||me.role=="consultant")h+=`<div class="card"><label>طلب جديد</label><div style="display:flex;gap:8px;flex-wrap:wrap">${Object.entries(FORMS).filter(([k])=>isC({form:k})==(me.role=="consultant")).map(([k,f])=>`<button onclick="view='new';cur='${k}';go()">${f.n}</button>`).join("")}</div></div>`;
return h+reqSections(()=>visible())}
function pageNew(){const F=FORMS[cur],df={contractor:me.role=="contractor"?me.name:"",project:D.project||"Project",date:today(),rev:0};return `<div class="card"><b>${F.n}</b><span class="note">الحقول بتختلف حسب النموذج: تقويم للتاريخ، ساعة للوقت، وجداول تقدر تزود صفوفها</span>${layout(F.f,df)}<label>المرفقات</label><input type="file" id="fl" multiple><div class="bar"><button onclick="submitR()">رفع الطلب</button><button class="g" onclick="view='list';go()">إلغاء</button></div></div>`}
async function submitR(){const F=FORMS[cur],no=nextNo(cur),fs=await readFiles(document.getElementById("fl"),{form:cur,no:no});
D.reqs.push({id:"r"+Date.now(),form:cur,no:no,by:me.id,created:Date.now(),data:readF(F.f),files:fs,resp:null});save();view="list";go();gUp(D.reqs[D.reqs.length-1])}
function pageOpen(){const r=D.reqs.find(x=>x.id==cur),F=FORMS[r.form];
const rows=F.f.filter(f=>f.t!="h").map(f=>`<tr><th>${H(f.l)}</th><td style="white-space:normal">${val(f,r.data[f.k])}</td></tr>`).join("");
let h=`<div class="card"><b>${F.n} · ${H(r.no)}</b> ${ctr(r)}<div class="ov"><table>${rows}<tr><th>المرفقات</th><td>${filesH(r.files)}</td></tr></table></div></div>`;
if(isC(r))h+=cPart(r);else if(r.resp)h+=`<div class="card"><b>رد الاستشاري</b><p>${CODES[r.resp.code]}</p><p>${H(r.resp.comment)||"—"}</p><p>المرفقات: ${filesH(r.resp.files)}</p><p class="note">${H(r.resp.by)} · ${new Date(r.resp.ts).toISOString().slice(0,10)}</p></div>`;
else if(me.role=="consultant")h+=`<div class="card"><b>رد الاستشاري</b><label>القرار</label><select id="code">${Object.entries(CODES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><label>الملاحظات</label><textarea id="cm" rows="4"></textarea><label>مرفقات الرد</label><input type="file" id="fl" multiple><br><button onclick="respond('${r.id}')">إرسال الرد</button></div>`;
return h+driveCard(r)+`<div class="bar"><button onclick="dl('${r.id}')">⬇ تحميل Excel (نفس الفورم الأصلي)</button><button class="g" onclick="view='list';go()">رجوع</button></div>`}
async function respond(id){const r=D.reqs.find(x=>x.id==id),fs=await readFiles(document.getElementById("fl"),{form:r.form,no:r.no});r.resp={ts:Date.now(),code:document.getElementById("code").value,comment:document.getElementById("cm").value,files:fs,by:me.name};save();view="list";go();gUp(r)}
function pageAdmin(){return `<div class="card"><b>اسم المشروع</b><div class="two"><input id="pn" value="${H(D.project||"Project")}"><button onclick="D.project=pn.value;save();go()">حفظ</button></div></div><div class="card"><b>📁 روابط Google Drive لكل نوع طلب</b><span class="note"> (بتظهر في صفحة الطلب وفي جدول الطلبات)</span><label>رابط Apps Script (للرفع التلقائي)</label><input id="gas" placeholder="https://script.google.com/macros/s/.../exec" value="${H(D.gas||"")}"><label>كلمة السر السرية للسكربت</label><input id="gkey" value="${H(D.gkey||"")}">${Object.entries(FORMS).map(([k,f])=>`<label>${H(f.n)} — رابط الفولدر</label><input id="dr_${k}" placeholder="https://drive.google.com/..." value="${H((D.drives||{})[k]||"")}">`).join("")}<br><br><button onclick="saveDrives()">حفظ الروابط</button></div><div class="card"><b>إنشاء مستخدم</b><div class="row"><div><label>الاسم</label><input id="un"></div><div><label>الإيميل</label><input id="ue" type="email"></div><div><label>الباسورد</label><input id="up"></div><div><label>الدور</label><select id="ur"><option value="contractor">Contractor</option><option value="consultant">Consultant</option><option value="owner">Owner</option></select></div></div><br><button onclick="addU()">إضافة</button> <span class="note">${msg}</span></div><div class="card"><b>المستخدمون</b><div class="ov"><table><tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th></th></tr>${D.users.map(u=>`<tr><td>${H(u.name)}</td><td>${H(u.email)}</td><td>${u.role=="admin"?"admin":`<select onchange="setRole('${u.id}',this.value)">${["contractor","consultant","owner"].map(r=>`<option value="${r}"${u.role==r?" selected":""}>${r}</option>`).join("")}</select>`}</td><td>${u.role=="admin"?`<button class="g" onclick="rstU('${u.id}')">تغيير الباسورد</button>`:`<button class="g" onclick="delU('${u.id}')">حذف</button> <button class="g" onclick="rstU('${u.id}')">باسورد جديد</button>`}</td></tr>`).join("")}</table></div></div><div class="card"><b>إدارة الطلبات</b> <span class="note">(الحذف الفردي من زرار 🗑 جنب كل طلب)</span><br><br><button class="g" onclick="delAll()">🗑 مسح كل الطلبات</button></div>${reqSections(()=>D.reqs)}`}
function addU(){const e=ue.value.trim().toLowerCase();if(!e||!up.value||!un.value){msg="كمّل البيانات";return go()}if(D.users.some(u=>u.email==e)){msg="الإيميل موجود";return go()}D.users.push({id:"u"+Date.now(),email:e,pw:up.value,role:ur.value,name:un.value});save();msg="تمت الإضافة";go()}
async function gDel(r){const fid=folderId(D.drives&&D.drives[r.form]);if(!cUrl()||!fid)return true;try{const j=await cCall({action:"delete",folder:fid,name:r.no+".xlsx",sub:r.no});if(!j.ok)throw new Error(j.err||"خطأ");return true}catch(e){alert("اتمسح "+r.no+" من الموقع لكن تعذر مسحه من الدرايف: "+((e&&e.message)||e));return false}}
async function delAll(){if(me.role!="admin"||!D.reqs.length)return;if(!confirm("هتمسح كل الطلبات ("+D.reqs.length+") من الموقع ومن الدرايف. متأكد؟"))return;if(prompt('اكتب كلمة "مسح" للتأكيد')!=="مسح")return;const rs=D.reqs.slice();D.reqs=[];D.del=(D.del||[]).concat(rs.map(r=>r.id));save();go();for(const r of rs)await gDel(r)}
function delReq(id){const r=D.reqs.find(x=>x.id==id);if(!r||me.role!="admin")return;if(!confirm("حذف الطلب "+r.no+" نهائياً؟\nملف الإكسل هيتمسح من Google Drive كمان."))return;D.reqs=D.reqs.filter(x=>x.id!=id);(D.del=D.del||[]).push(id);save();go();gDel(r)}
function setRole(i,r){const u=D.users.find(x=>x.id==i);if(!u||me.role!="admin"||u.role=="admin"||u.role==r)return go();if(!confirm("تغيير دور "+u.name+" من "+u.role+" إلى "+r+"؟"))return go();u.role=r;save();go()}
function delU(i){D.users=D.users.filter(u=>u.id!=i);save();go()}
function rstU(i){const p=prompt("الباسورد الجديد");if(p){D.users.find(u=>u.id==i).pw=p;save();go()}}
function login(){const u=D.users.find(x=>x.email==em.value.trim().toLowerCase()&&x.pw==pw.value);if(u){me=u;msg="";go()}else{msg="بيانات غلط";go()}}
function go(){const a=document.getElementById("app");try{if(me)localStorage.setItem("portal_sess",JSON.stringify({id:me.id,view:view,cur:cur}));else localStorage.removeItem("portal_sess")}catch(e){}if(!me){a.innerHTML=`<div class="lg"><div class="card lc"><div class="logos"><img src="${L.imc}"><img src="${L.moh}"><img src="${L.chem}"></div><b>تسجيل الدخول</b><label>الإيميل</label><input id="em" type="email"><label>الباسورد</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><button class="btn" onclick="login()">دخول</button> <span class="note">${msg}</span></div></div>`;return}
const p=me.role=="admin"&&view=="list"?pageAdmin():view=="new"?pageNew():view=="open"?pageOpen():pageList();a.innerHTML=head()+"<main>"+p+"</main>";a.oninput=calc}
try{const ss=JSON.parse(localStorage.getItem("portal_sess")||"null");if(ss){const uu=D.users.find(x=>x.id==ss.id);if(uu){me=uu;view=ss.view||"list";cur=ss.cur||null;if(view=="open"&&!D.reqs.find(r=>r.id==cur))view="list";if(view=="new"&&!FORMS[cur])view="list"}}}catch(e){}
go();cInit();
</script></body></html>
