  for(const[a,v]of Object.entries(spec.c))x=setCell(x,a,v);z.file("xl/worksheets/sheet1.xml",x);
  const checks=new Set((spec.k||[]).map(s=>normCb(s)));
  if(z.file("xl/drawings/drawing1.xml")){let dr=await z.file("xl/drawings/drawing1.xml").async("string");dr=dr.replace(/\{\{c(\d+)\}\}/g,(m,i)=>checks.has(normCb(i))?"\u2612":"\u2610");z.file("xl/drawings/drawing1.xml",dr)}
  if(z.file("xl/drawings/vmlDrawing1.vml")){let vml=await z.file("xl/drawings/vmlDrawing1.vml").async("string");
    vml=vml.replace(/<v:shape\b[\s\S]*?<\/v:shape>/g,(shape)=>{
      if(!/ObjectType="Checkbox"/.test(shape))return shape;
      const m=shape.match(/<v:textbox[^>]*>([\s\S]*?)<\/v:textbox>/);
      const cap=normCb(m?m[1].replace(/<[^>]+>/g," "):"");
      let s=shape.replace(/<x:Checked>1<\/x:Checked>/g,"");
      if(checks.has(cap)){s=s.replace(/<\/x:ClientData>/,"<x:Checked>1</x:Checked></x:ClientData>")}
      return s;
    });
    z.file("xl/drawings/vmlDrawing1.vml",vml)}
  return z.generateAsync({type:type||"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}

>المستخدمون</b><div class="ov"><table><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th></th></tr>${D.users.map(u=>`<tr><td>${H(u.name)}</td><td>${H(u.email)}</td><td>${u.role=="admin"?"admin":`<select onchange="setRole('${u.id}',this.value)">${["contractor","consultant","owner"].map(r=>`<option value="${r}"${u.role==r?" selected":""}>${r}</option>`).join("")}</select>`}</td><td>${u.role=="admin"?`<button class="g" onclick="rstU('${u.id}')">تغيير كلمة المرور</button>`:`<button class="g" onclick="delU('${u.id}')">حذف</button> <button class="g" onclick="rstU('${u.id}')">كلمة مرور جديدة</button>`}</td></tr>`).join("")}</table></div></div><div class="card"><b>إدارة الطلبات</b> <span class="note">(الحذف الفردي من زر 🗑 بجوار كل طلب)</span><br><br><button class="g" onclick="delAll()">🗑 حذف جميع الطلبات</button></div>${reqSections(()=>D.reqs)}${mediaSecs()}${ipcSec()}`}
function addU(){const e=ue.value.trim().toLowerCase();if(!e||!up.value||!un.value){msg="أكمل البيانات";return go()}if(D.users.some(u=>u.email==e)){msg="البريد الإلكتروني مستخدم مسبقًا";return go()}D.users.push({id:"u"+Date.now(),email:e,pw:up.value,role:ur.value,name:un.value});save();msg="تمت الإضافة";go()}
async function gDel(r){const fid=folderId(D.drives&&D.drives[r.form]);if(!cUrl()||!fid)return true;try{const j=await cCall({action:"delete",folder:fid,name:r.no+".xlsx",sub:r.no});if(!j.ok)throw new Error(j.err||"خطأ");return true}catch(e){alert("تم حذف "+r.no+" من الموقع لكن تعذر حذفه من Google Drive: "+((e&&e.message)||e));return false}}
async function delAll(){if(me.role!="admin"||!D.reqs.length)return;if(!confirm("سيتم حذف جميع الطلبات ("+D.reqs.length+") من الموقع ومن Google Drive. هل أنت متأكد؟"))return;if(prompt('اكتب كلمة "حذف" للتأكيد')!=="حذف")return;const rs=D.reqs.slice();D.reqs=[];D.del=(D.del||[]).concat(rs.map(r=>r.id));save();go();for(const r of rs)await gDel(r)}
function delReq(id){const r=D.reqs.find(x=>x.id==id);if(!r||me.role!="admin")return;if(!confirm("هل تريد حذف الطلب "+r.no+" نهائيًا؟\nسيُحذف ملف الإكسل من Google Drive أيضًا."))return;D.reqs=D.reqs.filter(x=>x.id!=id);(D.del=D.del||[]).push(id);save();go();gDel(r)}
function setRole(i,r){const u=D.users.find(x=>x.id==i);if(!u||me.role!="admin"||u.role=="admin"||u.role==r)return go();if(!confirm("تغيير دور "+u.name+" من "+u.role+" إلى "+r+"؟"))return go();u.role=r;save();go()}
function delU(i){D.users=D.users.filter(u=>u.id!=i);save();go()}
function rstU(i){const p=prompt("كلمة المرور الجديدة");if(p){D.users.find(u=>u.id==i).pw=p;save();go()}}
function login(){const u=D.users.find(x=>x.email==em.value.trim().toLowerCase()&&x.pw==pw.value);if(u){me=u;msg="";go()}else{msg="بيانات الدخول غير صحيحة";go()}}
async function previewX(r){
  try{
    mOvl(`<div class="mh"><div><b>معاينة: ${H(r.no)}</b><small>${H(FORMS[r.form].n)} — جاري الرفع إلى Google Drive...</small></div><button class="g x" onclick="closePreview()" aria-label="إغلاق">✕</button></div><div style="padding:40px;text-align:center;color:var(--mu)">جاري إنشاء المعاينة...</div>`,980);
    const blob=await mkBlob(r);
    const b64=await new Promise((ok,no)=>{const fr=new FileReader;fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=no;fr.readAsDataURL(blob)});
    const j=await cCall({action:"preview",folder:PREVIEW_FOLDER_ID,name:r.no+".xlsx",data:b64,mime:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    if(!j||!j.ok) throw new Error((j&&j.err)||"فشل الرفع");
    currentPreviewId=j.id;
    mOvl(`<div class="mh"><div><b>معاينة: ${H(r.no)}</b><small>${H(FORMS[r.form].n)}</small></div><button class="g x" onclick="closePreview()" aria-label="إغلاق">✕</button></div><div style="overflow:hidden;border-radius:12px;background:#fff"><iframe src="${H(j.url)}" style="width:100%;height:72vh;border:0" allowfullscreen></iframe></div><p class="note" style="margin:8px 0 0">هذه المعاينة (Google Drive viewer) مطابقة للملف المحمّل. عند الإغلاق سيتم حذف الملف من Drive.</p>`,1000);
  }catch(e){ alert("تعذر المعاينة: "+((e&&e.message)||e)); closePreview(); }
}
function closePreview(){ if(currentPreviewId){ const id=currentPreviewId; currentPreviewId=null; cCall({action:"deletePreview",id:id}).catch(()=>{}); } mClose(); }
function previewReq(id){const r=D.reqs.find(x=>x.id==id);if(r)previewX(r)}
async function previewNew(){const F=FORMS[cur];const no=nextNo(cur);const dp=readF(F.f);if(!nwsCheck(dp))return;const r={id:"preview",form:cur,no:no,by:me.id,created:Date.now(),data:dp,files:[],resp:null,sig:me.sig||""};await previewX(r)}
function go(){const a=document.getElementById("app");try{if(me)localStorage.setItem("portal_sess",JSON.stringify({id:me.id,view:view,cur:cur}));else{localStorage.removeItem("portal_sess");_an="";dmOpen=false;document.body.style.overflow=""}}catch(e){}if(!me){a.innerHTML=`<div class="lg"><div class="card lc"><div class="logos"><img src="${L.imc}"><img src="${L.moh}"><img src="${L.chem}"></div><div class="lt"><h2>بوابة طلبات المشروع</h2><p>${H(D.project||"")}</p></div><b>تسجيل الدخول</b><label>البريد الإلكتروني</label><input id="em" type="email"><label>كلمة المرور</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><button class="btn" onclick="login()">دخول</button> <span class="note">${msg}</span></div></div>`;return}
const p=me.role=="admin"&&view=="list"?pageAdmin():view=="new"?pageNew():view=="open"?pageOpen():pageList();a.innerHTML=head()+"<main>"+p+"</main>"+codeModal();a.oninput=calc;document.body.style.overflow=dmOpen&&me.role!="contractor"?"hidden":"";anim();setTimeout(loadIpcProgress,200);}
try{const ss=JSON.parse(localStorage.getItem("portal_sess")||"null");if(ss){const uu=D.users.find(x=>x.id==ss.id);if(uu){me=uu;view=ss.view||"list";cur=ss.cur||null;if(view=="open"&&!D.reqs.find(r=>r.id==cur))view="list";if(view=="new"&&!FORMS[cur])view="list"}}}catch(e){}
window.addEventListener("beforeunload",()=>{if(currentPreviewId){try{navigator.sendBeacon&&navigator.sendBeacon(cUrl(),JSON.stringify({key:cKey(),action:"deletePreview",id:currentPreviewId}))}catch(e){}}});
go();cInit();
</script></body></html>
